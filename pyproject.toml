[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-conductor"
version = "0.1.0"
description = "Cross-platform SDET automation framework"
requires-python = ">=3.11"
authors = [{ name = "David" }]

dependencies = [
    "pywinauto>=0.6.9",
    "pyyaml>=6.0",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
allure = [
    "allure-pytest>=2.13",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.99,<0.1",
    "allure-pytest>=2.13",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "waiting.py",
    "chrome_config.py",
    "chrome_process.py",
    "chrome_window.py",
    "chrome_menu.py",
    "chrome_devtools.py",
    "chrome.py",
    "chrome_checks.py",
    "yaml_config.py",
    "reporting.py",
    "pytest_conductor.py",
]

[project.entry-points.pytest11]
test_conductor = "pytest_conductor"

[tool.pytest.ini_options]
testpaths = ["unit-tests"]

addopts = "-ra --strict-markers --strict-config"

log_level = "DEBUG"
log_cli = false
log_format = "%(asctime)s %(levelname)-8s %(name)s %(message)s"
log_date_format = "%H:%M:%S"


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"unit-tests/*" = ["ANN001", "ANN201", "ANN202", "ANN204"]

[tool.ruff.format]
quote-style = "double"
