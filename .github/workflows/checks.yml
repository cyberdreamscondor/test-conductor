name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out the framework
        uses: actions/checkout@v7

      - name: Install uv and python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Create the virtual environment
        run: uv venv

      - name: Install the framework with its dev tools
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check .

      - name: Unit tests
        run: uv run pytest -q

      - name: Keep the artifacts of this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-py${{ matrix.python-version }}
          path: test-output/
          if-no-files-found: ignore

  report:
    name: publish the Allure report
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Collect the results of the unit suite
        uses: actions/download-artifact@v8
        with:
          name: test-output-py3.14
          path: test-output

      - name: Restore the published report's history
        run: |
          mkdir -p test-output/allure-results/history
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/history"
          for file in history.json history-trend.json retry-trend.json categories-trend.json duration-trend.json; do
            curl -sfL "$base/$file" -o "test-output/allure-results/history/$file" || true
          done
          ls -l test-output/allure-results/history

      - name: Install the Allure CLI
        run: npm install -g allure-commandline@2.46.1

      - name: Generate the report
        run: allure generate test-output/allure-results --clean -o allure-report

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload the report
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
